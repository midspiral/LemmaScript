name: Setup Lean
description: Clone Loom/Velvet forks and set up Lean toolchain

inputs:
  lake-package-directory:
    description: Directory containing the lakefile
    default: '.'
  use-github-cache:
    description: Whether to use GitHub cache for Lake packages
    default: 'false'

runs:
  using: composite
  steps:
    - name: Clone Loom fork
      shell: bash
      env:
        LAKE_PACKAGE_DIRECTORY: ${{ inputs.lake-package-directory }}
      run: |
        dependency_root="$(cd "$LAKE_PACKAGE_DIRECTORY/.." && pwd)"
        if [ ! -d "$dependency_root/loom" ]; then
          git clone https://github.com/namin/loom.git -b lemma "$dependency_root/loom"
        fi

    - name: Clone Velvet fork
      shell: bash
      env:
        LAKE_PACKAGE_DIRECTORY: ${{ inputs.lake-package-directory }}
      run: |
        dependency_root="$(cd "$LAKE_PACKAGE_DIRECTORY/.." && pwd)"
        if [ ! -d "$dependency_root/velvet" ]; then
          git clone https://github.com/namin/velvet.git -b lemma "$dependency_root/velvet"
        fi

    - uses: leanprover/lean-action@v1
      with:
        use-github-cache: ${{ inputs.use-github-cache }}
        build-args: ''
        lake-package-directory: ${{ inputs.lake-package-directory }}
