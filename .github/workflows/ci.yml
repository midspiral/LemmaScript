name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The former single `tools` job, split so its four slow parts run in
  # parallel: fixture checks (here), unit tests, and the two drift checks.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - name: Typecheck tools
        working-directory: tools
        run: npm run typecheck

      - name: Typecheck examples
        run: npm run typecheck:examples

      - uses: ./.github/actions/setup-dafny

      - name: Fixture checks (reject implicit declaration skips, CLI, Dafny fixtures)
        run: ./tools/test-fixtures.sh --fixtures

  # Sharded by test file. Tests within one file run in sequence, so the slowest
  # file bounds a shard however many shards there are.
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - uses: ./.github/actions/setup-dafny

      - name: Unit tests (shard ${{ matrix.shard }} of 2)
        run: ./tools/test-fixtures.sh --unit --test-shard=${{ matrix.shard }}/2

  generated-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - name: Regenerate Lean from TypeScript
        run: ./regen-lean.sh

      - name: Check Lean generated files are up to date
        run: |
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard -- '*.def.lean' '*.types.lean')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked generated Lean files:"
            echo "$untracked"
            exit 1
          fi

  # Drift + additions-only only, which needs no Dafny install; `dafny verify`
  # runs in the sharded `examples-dafny` job below.
  generated-dafny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - name: Regenerate Dafny (drift + additions-only; verify runs in examples-dafny)
        run: ./regen-dafny.sh --no-verify

      - name: Check Dafny generated files are up to date
        run: |
          git diff --exit-code -- '*.dfy.gen' '*.dfy'
          untracked=$(git ls-files --others --exclude-standard -- '*.dfy.gen')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked .dfy.gen files:"
            echo "$untracked"
            exit 1
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-lean
        with:
          use-github-cache: 'true'

      - name: Build
        run: lake build

  # Dafny verification of the examples, sharded across runners. `generated-dafny`
  # enforces drift + additions-only (regen --no-verify); this job runs the actual
  # `dafny verify` in parallel. Files are split by index (i % N == shard), so no
  # hand-maintained file list. Each shard also re-checks drift for its own slice.
  examples-dafny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - uses: ./.github/actions/setup-dafny

      - name: Check Dafny (shard ${{ matrix.shard }} of 4)
        run: |
          i=0
          for f in examples/*.ts; do
            if [ $((i % 4)) -eq ${{ matrix.shard }} ]; then
              echo "=== checking $f ==="
              npx tsx tools/src/lsc.ts check --backend=dafny "$f"
            fi
            i=$((i + 1))
          done

      - name: Check Dafny generated files are up to date (this shard)
        run: |
          git diff --exit-code -- '*.dfy.gen' '*.dfy'
          untracked=$(git ls-files --others --exclude-standard -- '*.dfy.gen')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked .dfy.gen files:"
            echo "$untracked"
            exit 1
          fi

  case-studies-dafny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: midspiral/collab-todo-lemmascript
            branch: main
          - repo: midspiral/colorwheel-lemmascript
            branch: main
          - repo: midspiral/node-casbin-lemmascript
            branch: lemmascript
          - repo: midspiral/clear-split-lemmascript
            branch: main
          - repo: midspiral/hono-lemmascript
            branch: lemmascript
          - repo: midspiral/hono-rate-limiter-with-lemmascript
            branch: main
          - repo: CHARM-BDF/charmchat
            branch: lemma
          - repo: midspiral/xyflow-lemmascript
            branch: lemmascript
          - repo: midspiral/equality-game-lemmascript
            branch: main
          - repo: midspiral/github-star-checker-lemmascript
            branch: main
          - repo: midspiral/rallly-lemmascript
            branch: lemmascript
          - repo: midspiral/talktimer-lemmascript
            branch: main
          - repo: midspiral/opencode-lemmascript
            branch: lemmascript
          - repo: midspiral/anthropic-sdk-lemmascript
            branch: lemmascript
          - repo: midspiral/trace-solo-lemmascript
            branch: main
          - repo: midspiral/pi-lemmascript
            branch: lemmascript
          - repo: midspiral/flue-lemmascript
            branch: lemmascript
          - repo: midspiral/balanced-match-lemmascript
            branch: lemmascript
          - repo: midspiral/guardians-lemmascript
            branch: main
          - repo: midspiral/guardians-lemmascript
            branch: generate-verify-execute
          - repo: midspiral/quorum-lemmascript
            branch: main
          - repo: midspiral/quorum-tutorial-lemmascript
            branch: main
          - repo: midspiral/quota-lemmascript
            branch: main
          - repo: midspiral/henri-lemmascript
            branch: main
          - repo: midspiral/henri-lemmascript
            branch: generate-verify-execute
          - repo: midspiral/henri-lemmascript
            branch: session
          - repo: midspiral/eventab-lemmascript
            branch: main
          - repo: midspiral/eventab-lemmascript
            branch: guard
            guard: true
          - repo: midspiral/eslint-plugin-with-lemmascript
            branch: main
          - repo: midspiral/infisical-lemmascript
            branch: lemmascript
          - repo: midspiral/mcp-sdk-lemmascript
            branch: lemmascript
    steps:
      - uses: actions/checkout@v6

      # Staging override: on a PR from branch <b>, if the case-study repo has a
      # branch named <pinned>-<b>, clone that instead of the pinned branch.
      # Lets case studies be updated against an in-flight LemmaScript branch
      # without touching the branch that main's CI pins.
      - name: Clone case study
        env:
          DEFAULT_BRANCH: ${{ matrix.branch }}
          LS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          repo="https://github.com/${{ matrix.repo }}.git"
          branch="$DEFAULT_BRANCH"
          if [ "$LS_BRANCH" != "main" ]; then
            staging="$DEFAULT_BRANCH-$LS_BRANCH"
            if git ls-remote --exit-code --heads "$repo" "$staging" >/dev/null; then
              echo "Using staging branch $staging (default: $DEFAULT_BRANCH)"
              echo "- \`${{ matrix.repo }}\`: staging branch \`$staging\` in place of \`$DEFAULT_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
              branch="$staging"
            fi
          fi
          git clone --branch "$branch" "$repo" ../case-study

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: cd tools && npm ci

      - name: Build lsc with the published guard
        if: matrix.guard
        run: |
          npm ci --include=optional
          npm run build

      - uses: ./.github/actions/setup-dafny

      - name: Regenerate and verify Dafny
        working-directory: ../case-study
        run: ../LemmaScript/tools/check.sh dafny

      - name: Verify extra Dafny files
        working-directory: ../case-study
        run: test -f ./check-extra.sh && ./check-extra.sh || true

      - name: Check generated Dafny files are up to date
        working-directory: ../case-study
        run: |
          git diff --exit-code -- '*.dfy.gen' '*.dfy'
          untracked=$(git ls-files --others --exclude-standard -- '*.dfy.gen')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked generated Dafny files:"
            echo "$untracked"
            exit 1
          fi

      - name: Regenerate and check runtime guard
        if: matrix.guard
        working-directory: ../case-study
        run: |
          rm src/allocate.guarded.ts
          node ../LemmaScript/tools/dist/lsc.js guard src/allocate.ts
          git diff --exit-code -- '*.guarded.ts'
          untracked=$(git ls-files --others --exclude-standard -- '*.guarded.ts')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked generated guards:"
            echo "$untracked"
            exit 1
          fi
          if grep -n "UNENFORCED" src/*.guarded.ts; then
            echo "ERROR: incomplete runtime guard"
            exit 1
          fi

      - name: Check guarded runtime and UI
        if: matrix.guard
        working-directory: ../case-study
        run: |
          npm ci
          npm run typecheck
          npm run demo
          npm --prefix ui ci
          npm --prefix ui run build

  case-studies-lean:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: midspiral/colorwheel-lemmascript
            branch: main
          - repo: midspiral/node-casbin-lemmascript
            branch: lemmascript
          - repo: midspiral/clear-split-lemmascript
            branch: main
          - repo: midspiral/pi-lemmascript
            branch: lemmascript
    steps:
      - uses: actions/checkout@v6
        with:
          path: LemmaScript

      # Staging override: on a PR from branch <b>, if the case-study repo has a
      # branch named <pinned>-<b>, clone that instead of the pinned branch.
      # Lets case studies be updated against an in-flight LemmaScript branch
      # without touching the branch that main's CI pins.
      - name: Clone case study
        env:
          DEFAULT_BRANCH: ${{ matrix.branch }}
          LS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          repo="https://github.com/${{ matrix.repo }}.git"
          branch="$DEFAULT_BRANCH"
          if [ "$LS_BRANCH" != "main" ]; then
            staging="$DEFAULT_BRANCH-$LS_BRANCH"
            if git ls-remote --exit-code --heads "$repo" "$staging" >/dev/null; then
              echo "Using staging branch $staging (default: $DEFAULT_BRANCH)"
              echo "- \`${{ matrix.repo }}\`: staging branch \`$staging\` in place of \`$DEFAULT_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
              branch="$staging"
            fi
          fi
          git clone --branch "$branch" "$repo" case-study

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci
        working-directory: LemmaScript/tools

      - uses: ./LemmaScript/.github/actions/setup-lean
        with:
          lake-package-directory: case-study
          use-github-cache: 'true'

      - name: Regenerate and build Lean
        working-directory: case-study
        run: ../LemmaScript/tools/check.sh lean

      - name: Check generated Lean files are up to date
        working-directory: case-study
        run: |
          git diff --exit-code -- '*.def.lean' '*.types.lean'
          untracked=$(git ls-files --others --exclude-standard -- '*.def.lean' '*.types.lean')
          if [ -n "$untracked" ]; then
            echo "ERROR: Untracked generated Lean files:"
            echo "$untracked"
            exit 1
          fi
